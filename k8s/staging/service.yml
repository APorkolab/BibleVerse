apiVersion: v1
kind: Service
metadata:
  name: bibleverse-service-staging
  namespace: bibleverse-staging
  labels:
    app: bibleverse
    environment: staging
    tier: frontend
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
    service.beta.kubernetes.io/aws-load-balancer-cross-zone-load-balancing-enabled: "true"
    prometheus.io/scrape: "true"
    prometheus.io/port: "8080"
    prometheus.io/path: "/metrics"
spec:
  type: ClusterIP
  selector:
    app: bibleverse
    environment: staging
  ports:
  - name: http
    protocol: TCP
    port: 80
    targetPort: http
  sessionAffinity: None

---
apiVersion: v1
kind: Service
metadata:
  name: bibleverse-headless-staging
  namespace: bibleverse-staging
  labels:
    app: bibleverse
    environment: staging
    tier: frontend
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8080"
    prometheus.io/path: "/metrics"
spec:
  type: ClusterIP
  clusterIP: None
  selector:
    app: bibleverse
    environment: staging
  ports:
  - name: http
    protocol: TCP
    port: 80
    targetPort: http
