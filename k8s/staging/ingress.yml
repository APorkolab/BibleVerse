apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: bibleverse-ingress-staging
  namespace: bibleverse-staging
  labels:
    app: bibleverse
    environment: staging
    tier: frontend
  annotations:
    # NGINX Ingress Controller annotations
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/use-regex: "true"
    
    # Security headers
    nginx.ingress.kubernetes.io/configuration-snippet: |
      add_header X-Frame-Options DENY always;
      add_header X-Content-Type-Options nosniff always;
      add_header X-XSS-Protection "1; mode=block" always;
      add_header Referrer-Policy "strict-origin-when-cross-origin" always;
      add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://szentiras.hu; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net; font-src 'self' https://fonts.gstatic.com https://cdn.jsdelivr.net; img-src 'self' data: https:; connect-src 'self' https://szentiras.hu https://api.szentiras.hu;" always;
      add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    
    # Rate limiting
    nginx.ingress.kubernetes.io/rate-limit-connections: "10"
    nginx.ingress.kubernetes.io/rate-limit-requests-per-minute: "60"
    nginx.ingress.kubernetes.io/rate-limit-window: "1m"
    
    # SSL/TLS
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-ciphers: "ECDHE-RSA-AES128-GCM-SHA256,ECDHE-RSA-AES256-GCM-SHA384,ECDHE-RSA-AES128-SHA256,ECDHE-RSA-AES256-SHA384"
    nginx.ingress.kubernetes.io/ssl-protocols: "TLSv1.2 TLSv1.3"
    
    # Caching
    nginx.ingress.kubernetes.io/server-snippet: |
      location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff;
      }
      location ~* \.html$ {
        expires 1h;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options nosniff;
      }
    
    # Health check
    nginx.ingress.kubernetes.io/custom-http-errors: "404,503"
    
spec:
  tls:
  - hosts:
    - staging-bibleverse.porkolab.hu
    secretName: bibleverse-staging-tls
  rules:
  - host: staging-bibleverse.porkolab.hu
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: bibleverse-service-staging
            port:
              number: 80
